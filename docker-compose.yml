# ============================================================
# UHV-Web-Portal-blau (v3) – docker-compose für Self-Hosting
# Getestet für: Amlogic S912 TV-Box, Armbian Linux 6.1.149-ophub,
#               Debian bookworm, ARM64 (arm64/aarch64)
#
# Start:   docker compose up -d --build
# Logs:    docker compose logs -f
# Stop:    docker compose down
# Update:  siehe scripts/update.sh
# ============================================================
services:
  hausverwaltung-blau-p3000:
    build:
      context: .
      dockerfile: Dockerfile
    image: uhv-web-portal:latest
    container_name: uhv-web-portal-blau-p3000
    restart: unless-stopped
      # Host-Port links, Container-Port rechts.
      # 3000 frei wählbar anpassen, falls auf der TV-Box schon belegt
      # (homeassistant/portainer laufen üblicherweise auf anderen Ports).
      # Persistiert die komplette Datenbank (node:sqlite, D1-kompatibel via
      # server/d1-shim.mjs: Objekte, Wohnungen, Mieter, Zählerstände, Kosten,
      # Dokumente, Logo/Branding, Logins).
      # OHNE dieses Volume gehen bei jedem Container-Neustart alle Daten verloren!
      # WICHTIG: Der Volume-Name "hausverwaltung_data" wird bewusst NICHT auf
      # "uhv_data" umbenannt, obwohl die App jetzt "UHV-Web-Portal-blau-p3000" heißt –
      # Docker würde bei einem geänderten Namen ein NEUES, leeres Volume
      # anlegen und alle bereits erfassten Objekte/Wohnungen/Mieter/
      # Zählerstände/Kosten bestehender Installationen wären scheinbar
      # verschwunden (das alte Volume bliebe zwar erhalten, aber unverknüpft).
      # HINWEIS: Der interne Mount-Pfad wurde von "/app/.wrangler/state" auf
      # "/app/data" geändert (Umstieg von "wrangler pages dev" auf den
      # nativen Node-Server, siehe Dockerfile). Bei einem Update von einer
      # Installation vor diesem Fix bitte einmalig die alte Datenbankdatei
      # aus dem Volume kopieren, siehe INSTALL.md "Fehlerbehebung".
    ports:
      - "3000:3000"
    volumes:
      - uhv-web-blau-p3000_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      networks:
      - uhv-web-blau-p3000_net

networks:
  uhv-web-blau-p3000_net:
    driver: bridge

volumes:
  uhv-web-blau-p3000_data:
    driver: local

